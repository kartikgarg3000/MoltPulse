[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  NETLIFY_DISABLE_FLOATING_BADGE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables — add these in Netlify dashboard > Site > Environment Variables
# NEXT_PUBLIC_SUPABASE_URL
# NEXT_PUBLIC_SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# GITHUB_TOKEN
# ADMIN_EMAIL
# CRON_SECRET
# NEXT_PUBLIC_GA_ID (optional)
# NEXT_PUBLIC_STATIC_ONLY=true  (set when Supabase quota is exceeded)

# ─── Cache Headers ────────────────────────────────────────────────────────────
# Badge endpoint: cached at CDN edge for 1 hour, stale-while-revalidate 24h.
# Prevents badge embeds on GitHub READMEs from hammering the origin on every
# page view — the CDN serves the cached SVG instead.
[[headers]]
  for = "/api/badge/*"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

# Static assets — cache aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Security Headers (all routes) ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ─── Rate Limiting (Netlify Edge — requires Pro or higher for full enforcement)
# These headers signal intent; in-code rate limiting (lib/rate-limit.ts)
# is the active enforcement layer for the free plan.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-RateLimit-Policy = "60-per-minute-per-ip"
